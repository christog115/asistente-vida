# Al subir una etiqueta (ej. v0.2.0) arma los instaladores y los publica en
# GitHub Releases; las apps instaladas los descargan solas (src/updater.js).
name: Publicar versión
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Revisar que la etiqueta coincida con package.json
        shell: bash
        run: |
          # Si no coinciden, electron-builder publica la versión vieja y la nueva queda vacía.
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::La etiqueta es $GITHUB_REF_NAME pero package.json dice $have. Sube la versión en package.json y vuelve a etiquetar."
            exit 1
          fi
      - run: npm ci
      - name: Construir y publicar
        shell: bash
        run: |
          # Solo se firma si existen los secretos; un CSC_LINK vacío rompe electron-builder ("not a file").
          if [ -n "$SIGN_LINK" ]; then export CSC_LINK="$SIGN_LINK" CSC_KEY_PASSWORD="$SIGN_PASSWORD"; fi
          npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: con estos secretos en GitHub (Settings → Secrets → Actions) el instalador sale firmado.
          # Windows: CSC_LINK (certificado .pfx en base64) y CSC_KEY_PASSWORD.
          # Mac: además APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID.
          SIGN_LINK: ${{ secrets.CSC_LINK }}
          SIGN_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

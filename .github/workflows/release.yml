# Al subir una etiqueta (ej. v0.2.0) arma los instaladores y los publica en
# GitHub Releases; las apps instaladas los descargan solas (src/updater.js).
name: Publicar versión
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: con estos secretos en GitHub (Settings → Secrets → Actions) el instalador sale firmado.
          # Windows: CSC_LINK (certificado .pfx en base64) y CSC_KEY_PASSWORD.
          # Mac: además APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD y APPLE_TEAM_ID.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
